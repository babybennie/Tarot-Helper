<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tarot Journal ✦ Private Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#fff9f6;
  --card:#fffdfb;
  --pink:#f4bfd1;
  --pink2:#ffe8ef;
  --lav:#ddd2f5;
  --lav2:#f1edff;
  --rose:#ad637c;
  --ink:#5a4b52;
  --muted:#94858b;
  --line:#eee0e5;
  --green:#6d9b82;
  --yellow:#c49350;
  --red:#c96d7a;
  --shadow:0 15px 35px rgba(103,72,87,.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 5% 0,#ffe9f1 0,transparent 25%),
    radial-gradient(circle at 100% 10%,#eee9ff 0,transparent 27%),
    var(--bg);
  color:var(--ink);
  font-family:
    system-ui,
    -apple-system,
    "Noto Sans Thai",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* TOP BAR */

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#fffaf5dd;
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}

.topin{
  max-width:1250px;
  margin:auto;
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
}

.logo{
  width:43px;
  height:43px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(
    135deg,
    var(--pink2),
    var(--lav2)
  );
  font-size:22px;
}

.brand small{
  display:block;
  font-size:10px;
  color:var(--muted);
}

.spacer{
  flex:1;
}

.pill{
  border:1px solid var(--line);
  background:#fff;
  border-radius:99px;
  padding:8px 12px;
  font-size:12px;
  color:var(--muted);
}

/* LAYOUT */

.layout{
  max-width:1250px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:215px 1fr;
  gap:20px;
}

.side{
  height:max-content;
  position:sticky;
  top:76px;
  background:#fffdfbe8;
  border:1px solid var(--line);
  border-radius:24px;
  padding:10px;
  box-shadow:var(--shadow);
}

.nav{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  border-radius:14px;
  padding:11px 12px;
  color:var(--ink);
  font-weight:700;
}

.nav:hover,
.nav.active{
  background:
    linear-gradient(
      135deg,
      #fff0f5,
      #f3efff
    );
  color:var(--rose);
}

.main{
  min-width:0;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:28px;
  padding:27px;
  background:
    linear-gradient(
      135deg,
      #ffe9f0,
      #f0ebff
    );
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.hero:after{
  content:"☾  ✦  ♡";
  position:absolute;
  right:20px;
  top:15px;
  color:#9e789033;
  font-size:35px;
  letter-spacing:8px;
}

.hero h1{
  margin:0 0 4px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:var(--muted);
}

/* BUTTONS */

.btn{
  border:0;
  border-radius:14px;
  padding:10px 14px;
  font-weight:800;
  box-shadow:0 5px 12px #80616d10;
}

.primary{
  background:
    linear-gradient(
      135deg,
      #d98da7,
      #aa7bc8
    );
  color:white;
}

.soft{
  background:var(--pink2);
  color:#98546d;
}

.lav{
  background:var(--lav2);
  color:#705b9c;
}

.ghost{
  background:white;
  border:1px solid var(--line);
  box-shadow:none;
}

.danger{
  background:#fff0f2;
  color:#b55d6b;
}

.small{
  padding:7px 10px;
  font-size:12px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:12px;
}

.stat,
.card{
  background:#fffdfbf2;
  border:1px solid var(--line);
  border-radius:21px;
  box-shadow:var(--shadow);
}

.stat{
  padding:15px;
  min-height:110px;
}

.stathead{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.ico{
  width:34px;
  height:34px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:var(--pink2);
}

.stat strong{
  font-size:28px;
  display:block;
  margin-top:9px;
}

.stat small{
  color:var(--muted);
}

/* DASHBOARD */

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:24px 0 11px;
}

.title h2{
  margin:0;
  font-size:18px;
}

.title p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
}

.grid2{
  display:grid;
  grid-template-columns:
    1.2fr .8fr;
  gap:14px;
}

.grid3{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:14px;
}

.card{
  padding:17px;
}

/* GRAPH */

.chart{
  height:280px;
}

.bars{
  height:210px;
  display:flex;
  align-items:end;
  gap:10px;
}

.barcol{
  height:100%;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:end;
  align-items:center;
  gap:5px;
}

.bar{
  width:min(34px,75%);
  border-radius:
    12px 12px 5px 5px;
  background:
    linear-gradient(
      #d88da8,
      #a783c6
    );
  min-height:4px;
}

.barlabel,
.barvalue{
  font-size:11px;
  color:var(--muted);
}

/* LIST */

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff9fc;
}

.grow{
  flex:1;
  min-width:0;
}

.item b{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.muted{
  font-size:12px;
  color:var(--muted);
}

/* STATUS */

.badge{
  display:inline-flex;
  padding:5px 8px;
  border-radius:99px;
  font-size:11px;
  font-weight:800;
  background:#f4edf0;
  color:#7d6971;
}

.green{
  background:#edf8f1;
  color:#5d8e73;
}

.yellow{
  background:#fff6e6;
  color:#ad7c37;
}

.red{
  background:#fff0f2;
  color:#b85c6b;
}

.purple{
  background:#f0ecff;
  color:#735fa0;
}

/* PAGE */

.pagehead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.pagehead h1{
  margin:0;
  font-size:25px;
}

.pagehead p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:13px;
}

/* FORM */

.input,
.select,
.textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fffdfc;
  border-radius:13px;
  padding:10px 12px;
  color:var(--ink);
  outline:none;
}

.textarea{
  min-height:110px;
  resize:vertical;
}

.input:focus,
.select:focus,
.textarea:focus{
  border-color:#d9aec0;
  box-shadow:
    0 0 0 4px #f5dce544;
}

.search{
  max-width:350px;
}

.form{
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:5px;
  color:#806d75;
}

/* TABLE */

.table{
  width:100%;
  border-collapse:
    separate;
  border-spacing:
    0 7px;
}

.table th{
  text-align:left;
  font-size:11px;
  color:#9a898f;
  padding:0 9px;
}

.table td{
  background:#fffdfc;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:11px 9px;
  font-size:13px;
}

.table td:first-child{
  border-left:1px solid var(--line);
  border-radius:
    13px 0 0 13px;
}

.table td:last-child{
  border-right:1px solid var(--line);
  border-radius:
    0 13px 13px 0;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

/* CARD EDITOR */

.cardrow{
  display:grid;
  grid-template-columns:
    45px 1.1fr 115px 1.5fr auto;
  gap:8px;
  align-items:start;
  padding:12px;
  border:1px solid var(--line);
  background:#fff9fc;
  border-radius:17px;
  margin-bottom:9px;
}

.sectionrow{
  display:grid;
  grid-template-columns:
    1fr 2fr auto;
  gap:8px;
  padding:12px;
  border:1px solid var(--line);
  background:#fff9fc;
  border-radius:17px;
  margin-bottom:9px;
}

.save{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#bbb;
}

.saving{
  background:#d9a064;
}

.saved{
  background:#72a181;
}

.empty{
  text-align:center;
  padding:28px;
  color:var(--muted);
}

/* LOGIN */

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.loginbox{
  width:min(430px,100%);
  background:#fffdfb;
  border:1px solid var(--line);
  border-radius:30px;
  padding:28px;
  box-shadow:var(--shadow);
}

.loginart{
  text-align:center;
  font-size:44px;
}

.loginbox h1{
  text-align:center;
  margin:3px;
}

.loginbox p{
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#493d4480;
  z-index:50;
  display:grid;
  place-items:center;
  padding:18px;
}

.modalbox{
  width:min(680px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fffdfb;
  border-radius:25px;
  padding:20px;
}

.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modalhead h2{
  margin:0;
  font-size:19px;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:100;
  background:#5b4d54;
  color:#fff;
  padding:12px 15px;
  border-radius:14px;
  font-size:13px;
}

/* MOBILE */

@media(max-width:950px){

  .layout{
    grid-template-columns:1fr;
  }

  .side{
    position:static;
    display:flex;
    overflow:auto;
  }

  .nav{
    white-space:nowrap;
    width:auto;
  }

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .grid2,
  .grid3{
    grid-template-columns:1fr;
  }

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .cardrow{
    grid-template-columns:
      45px 1fr 115px;
  }

  .cardrow .interpret{
    grid-column:2/-1;
  }

  .sectionrow{
    grid-template-columns:1fr;
  }

  .side{
    gap:3px;
  }
}

@media(max-width:560px){

  .layout{
    padding:12px;
  }

  .topin{
    padding:10px 12px;
  }

  .pill{
    display:none;
  }

  .hero{
    padding:21px;
  }

  .hero h1{
    font-size:23px;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:12px;
  }

  .stat strong{
    font-size:23px;
  }

  .table{
    display:block;
    overflow:auto;
  }
}
</style>
</head>

      m => ({

function toast(message){

  $("toast").textContent =
    message;

  $("toast")
    .classList
    .remove("hidden");

  setTimeout(
    () =>

        .classList
        .add("hidden"),
    2200
  );

}

    return "-";

    .toLocaleString(
      "th-TH",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    );

}


function dt(value){

  if(!value)
    return "";

  const d =
    new Date(value);

  const p =
    n =>
      String(n)
        .padStart(2,"0");

  return `${d.getFullYear()}-${p(
    d.getMonth()+1
  )}-${p(
    d.getDate()
  )}T${p(
    d.getHours()
  )}:${p(
    d.getMinutes()
  )}`;

}


function badge(status){

  const data =
    STATUS[status] ||
    [status,""];

  return `
    <span class="badge ${data[1]}">
      ${data[0]}
    </span>
  `;

}


function memberName(id){

  return members
    .find(x => x.id === id)
    ?.name ||
    "ไม่ระบุ";

}


function serviceName(id){

  return services

function page(p){

  document
    .querySelectorAll("main section")
    .forEach(
      x =>
        x.classList.add("hidden")
    );

  $(p)
    .classList
    .remove("hidden");

  document
    .querySelectorAll(".nav")
    .forEach(
      x =>
        x.classList.toggle(
          "active",
          x.dataset.p === p
        )
    );

  const fn = {

    dashboard:dash,

    members:membersPage,

    services:servicesPage,

    readings:readingsPage,

    templates:templatesPage,

    reviews:reviewsPage

  }[p];

  if(fn)
    fn();

}

$("loginForm")

sb.auth.onAuthStateChange(
  async (_,session) => {

    if(session){

      $("login")
        .classList
        .add("hidden");

      $("app")
        .classList
        .remove("hidden");

      $("user")
        .textContent =

    }
    else{

        .classList

        .classList
        .remove("hidden");

async function saveMember(id){

  const p = {

    name:
      $("mn")
        .value
        .trim(),

    nickname:
      $("mk")
        .value
        .trim(),

    contact_channel:
      $("mc")
        .value
        .trim(),

    contact_id:
      $("mi")
        .value
        .trim(),

    note:
      $("mm")
        .value
        .trim()

  };


  if(!p.name)
    return toast(
      "กรุณาใส่ชื่อ"
    );


  const q =
    id
      ? sb
          .from("members")
          .update(p)
          .eq("id",id)
      : sb
          .from("members")
          .insert(p);


  const {
    error
  } = await q;


  if(error)
    return toast(
      error.message
    );


  closeModal();

  await load();

  membersPage();

  toast(
    "บันทึกแล้ว 💕"
  );

}


async function delMember(id){

  if(

    )
  )
    return;


  await sb
    .from("members")
    .delete()
    .eq("id",id);


  await load();

  membersPage();

}

async function saveService(id){

  const p = {

    name:
      $("sv")
        .value
        .trim(),

    price:
      $("sp").value
        ? Number(
            $("sp").value
          )
        : null,

    card_count:
      Number(
        $("sc").value
      ) || 3,

    delivery_hours:
      Number(
        $("sh").value
      ) || 24,

    description:
      $("sd")
        .value
        .trim(),

    active:true

  };


  if(!p.name)
    return toast(
      "กรุณาใส่ชื่อบริการ"
    );


  let data,
      error;


  if(id){

    ({
      error
    } =
      await sb
        .from("services")
        .update(p)
        .eq("id",id));

  }
  else{

    ({
      data,
      error
    } =
      await sb
        .from("services")
        .insert(p)
        .select()
        .single());

  }


  if(error)
    return toast(
      error.message
    );


  if(!id && data){

    for(
      let i=1;
      i<=p.card_count;
      i++
    ){

      await sb
        .from("service_positions")
        .insert({

          service_id:
            data.id,

          position_number:
            i,

          position_name:
            `ตำแหน่งที่ ${i}`

        });

    }

  }


  closeModal();

  await load();

  servicesPage();

  toast(
    "บันทึกบริการแล้ว ✨"
  );

}

  await sb

  await load();

}

function deadline(r){

  if(!r.deadline_at){

    return `
      <span class="muted">
        ไม่กำหนด
      </span>
    `;

  }


  if(
    [
      "closed",
      "cancelled",
      "checked"
    ].includes(
      r.status
    )
  ){

    return fmt(
      r.deadline_at
    );

  }


  const d =
    new Date(
      r.deadline_at
    ) -
    Date.now();


  return `

    <span
      class="
        badge
        ${
          d < 0
            ? "red"
            : d < 864e5
              ? "yellow"
              : "green"
        }
      "
    >

      ${
        d < 0
          ? "เกินกำหนด"
          : fmt(
              r.deadline_at
            )
      }

    </span>

  `;

}

        ),

      sb

/* =========================================================
   SAVE READING
========================================================= */

async function save(
  manual=false
){

  const p = {

    member_id:
      $("em")
        ?.value ||
      null,

    service_id:
      $("es")
        ?.value ||
      null,

    question:
      $("eq")
        ?.value ||
      "",

    started_at:
      $("est")
        ?.value
        ? new Date(
            $("est").value
          ).toISOString()
        : new Date()
            .toISOString(),

    deadline_at:
      $("edl")
        ?.value
        ? new Date(
            $("edl").value
          ).toISOString()
        : null,

    status:
      $("ets")
        ?.value ||
      "pending",

    overall_reading:
      $("eo")
        ?.value ||
      "",

    private_note:
      $("ep")
        ?.value ||
      ""

  };


  let rid =
    current.id;

  let error,
      data;


  if(rid){

    ({
      error
    } =
      await sb
        .from("readings")
        .update(p)
        .eq(
          "id",
          rid
        ));

  }
  else{

    ({
      data,
      error
    } =
      await sb
        .from("readings")
        .insert(p)
        .select()
        .single());


    if(data){

      rid =
        data.id;

      current = {

        ...current,

        ...data,

        id:rid

      };

    }

  }


  if(error){

    toast(
      error.message
    );

    return;

  }


  if(!rid)
    return;


  await saveCards(rid);

  await saveSections(rid);


  await load();


  current = {

    ...readings.find(
      x => x.id === rid
    ),

    ...p,

    id:rid

  };


  $("sdot")
    ?.classList
    .remove("saving");


  $("sdot")
    ?.classList
    .add("saved");


  if($("stxt")){

    $("stxt")
      .textContent =
      "บันทึกแล้ว · " +
      new Date()
        .toLocaleTimeString(
          "th-TH",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );

  }


  if(manual)
    toast(
      "บันทึกงานแล้ว 💾"
    );

}


/* =========================================================
   SAVE CARDS
========================================================= */

async function saveCards(rid){

  const {
    data:old
  } =
    await sb
      .from("reading_cards")
      .select("id")
      .eq(
        "reading_id",
        rid
      );


  const keep =
    cards
      .filter(
        x => x.id
      )
      .map(
        x => x.id
      );


  const rm =
    (old || [])
      .map(
        x => x.id
      )
      .filter(
        id =>
          !keep.includes(id)
      );


  if(rm.length){

    await sb
      .from("reading_cards")
      .delete()
      .in(
        "id",
        rm
      );

  }


  for(
    let i=0;
    i<cards.length;
    i++
  ){

    const c =
      cards[i];


    const p = {

      reading_id:
        rid,

      position_number:
        i+1,

      position_name:
        c.position_name ||
        `ตำแหน่งที่ ${i+1}`,

      card_id:
        c.card_id ||
        CARDS[0][0],

      orientation:
        c.orientation ||
        "upright",

      interpretation:
        c.interpretation ||
        ""

    };


    if(c.id){

      await sb
        .from("reading_cards")
        .update(p)
        .eq(
          "id",
          c.id
        );

    }
    else{

      const {
        data
      } =
        await sb
          .from(
            "reading_cards"
          )
          .insert(p)
          .select()
          .single();


      if(data)
        c.id =
          data.id;

    }

  }

}

async function cloneReading(id){

  const r =
    readings.find(
      x => x.id === id
    );


  if(!r)
    return;


  const {
    data:n,
    error
  } =
    await sb
      .from("readings")
      .insert({

        member_id:
          r.member_id,

        service_id:
          r.service_id,

        question:"",

        started_at:
          new Date()
            .toISOString(),

        deadline_at:
          new Date(
            Date.now() +
            864e5
          ).toISOString(),

        status:
          "pending",

        overall_reading:"",

        private_note:""

      })
      .select()
      .single();


  if(error)
    return toast(
      error.message
    );


  const [
    a,
    b
  ] =
    await Promise.all([

      sb
        .from(
          "reading_cards"
        )
        .select("*")
        .eq(
          "reading_id",
          id
        )
        .order(
          "position_number"
        ),

      sb
        .from(
          "reading_sections"
        )
        .select("*")
        .eq(
          "reading_id",
          id
        )
        .order(
          "sort_order"
        )

    ]);


  if(
    a.data?.length
  ){

    await sb
      .from(
        "reading_cards"
      )
      .insert(
        a.data.map(
          x => ({

            reading_id:
              n.id,

            position_number:
              x.position_number,

            position_name:
              x.position_name,

            card_id:
              x.card_id,

            orientation:
              x.orientation,

            interpretation:""

          })
        )
      );

  }


  if(
    b.data?.length
  ){

    await sb
      .from(
        "reading_sections"
      )
      .insert(
        b.data.map(
          (x,i) => ({

            reading_id:
              n.id,

            title:
              x.title,

            content:"",

            sort_order:i

          })
        )
      );

  }


  await load();

  openReading(n.id);

  toast(
    "สร้างงานใหม่จากงานเดิมแล้ว 🌷"
  );

}

            class="input"
            type="datetime-local"
            value="${dt(
              new Date()
            )}"
          >

        </div>


        <div class="field">

          <label>
            ช่องทาง
          </label>

          <input
            id="rc"
            class="input"
          >

        </div>


        <div class="field">

          <label>
            คะแนน
          </label>

          <select
            id="ra"
            class="select"
          >

            ${
              [5,4,3,2,1]
                .map(
                  n => `

                    <option
                      value="${n}"
                    >
                      ${
                        "★".repeat(n)
                      }
                      (${n}/5)
                    </option>

                  `
                )
                .join("")
            }

          </select>

        </div>


        <div class="field full">

          <label>
            ข้อความรีวิว
          </label>

          <textarea
            id="rt"
            class="textarea"
          ></textarea>

        </div>


        <div class="field">

          <label>
            สิ่งที่ลูกค้าชอบ
          </label>

          <textarea
            id="rl"
            class="textarea"
          ></textarea>

        </div>


        <div class="field">

          <label>
            สิ่งที่ควรปรับปรุง
          </label>

          <textarea
            id="ri"
            class="textarea"
          ></textarea>

        </div>


        <div class="field full">

          <label>
            หมายเหตุเพื่อพัฒนางาน
          </label>

          <textarea
            id="rdev"
            class="textarea"
          ></textarea>

        </div>

      </div>


      <button
        class="btn primary"
        style="margin-top:13px"
        onclick="saveReview()"
      >
        บันทึกรีวิว 💕
      </button>

    `

  );

}


async function saveReview(){

  const p = {

    member_id:
      $("rm").value ||
      null,

    reading_id:
      $("rr").value ||
      null,

    review_date:
      new Date(
        $("rd").value
      ).toISOString(),

    channel:
      $("rc").value,

    rating:
      Number(
        $("ra").value
      ),

    review_text:
      $("rt").value,

    liked_points:
      $("rl").value,

    improvement_points:
      $("ri").value,

    development_note:
      $("rdev").value

  };


  const {
    error
  } =
    await sb
      .from("reviews")
      .insert(p);


  if(error)
    return toast(
      error.message
    );


  closeModal();

  await load();

  reviewsPage();

  toast(
    "เก็บรีวิวแล้ว 💌"
  );

}


async function delReview(id){

  if(
    !confirm(
      "ลบรีวิวนี้หรือไม่?"
    )
  )
    return;


  await sb
    .from("reviews")
    .delete()
    .eq(
      "id",
      id
    );


  await load();

  reviewsPage();

}

</script>

</body>
</html>
